[project]
name = "ha-sleepiq"
version = "0.1.0"
description = "Home Assistant's SleepIQ integration with massage control added."
requires-python = ">=3.13"

# Ruff is configured in ruff.toml, which explains why the vendored core files
# keep core's import order. Ruff reads that file in preference to this one.

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-homeassistant-custom-component's `hass` fixture is async, and pytest
# does not handle async fixtures natively. Without this every tests/ha test
# errors with "requested an async fixture with no plugin or hook that handled
# it" rather than failing on anything real.
asyncio_mode = "auto"

# `strict-typing` is the Platinum rule with teeth: Home Assistant runs mypy in
# strict mode over integrations that claim it. The settings below mirror the
# strict block core applies to a strict-typed integration, with nothing
# relaxed. Without Home Assistant installed every class it exports is Any and a
# local run reports subclassing Any and untyped decorators; that run is not the
# check. The GitHub Tests job runs this configuration with Home Assistant
# installed, and that run is.
[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
# asyncsleepiq publishes its names by importing them in __init__.py without an
# __all__. Core's mypy sees the same library and accepts the imports because
# its strict block applies to component modules only; this override gives the
# library the same treatment here so the vendored core files stay untouched.
module = "asyncsleepiq.*"
implicit_reexport = true

[[tool.mypy.overrides]]
# The vendored light.py imports ColorMode from homeassistant.components.light,
# which re-exports it from its const module without an __all__ - Home
# Assistant's own import style, byte-identical to core. Core's mypy accepts it
# because its strict block is scoped to the component; this override scopes
# the same allowance to that one module so the vendored file stays untouched.
module = "homeassistant.components.light"
implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false
