[project]
name = "ha-sleepiq"
version = "0.2.0"
description = "Home Assistant's SleepIQ integration with massage control added."
# homeassistant 2026.8.3 declares Requires-Python >=3.14.2. The Tests job
# installs 3.14, the mypy block pins python_version 3.14 and ruff targets
# py314, whose parenthesis-free except clauses this tree uses.
requires-python = ">=3.14"

# Ruff is configured in ruff.toml, which explains why the vendored core files
# keep core's import order. Ruff reads that file in preference to this one.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Loaded before the entry point plugins, which is the only moment early enough
# to stand in for the POSIX modules Home Assistant imports on the way in. It
# does nothing on Linux, and so nothing in CI. Run pytest as `python -m pytest`
# so the repository root is on sys.path and `tests.winposix` can be imported.
addopts = "-p tests.winposix"
# pytest-homeassistant-custom-component's `hass` fixture is async, and pytest
# does not handle async fixtures natively. Without this every tests/ha test
# errors with "requested an async fixture with no plugin or hook that handled
# it" rather than failing on anything real.
asyncio_mode = "auto"

# `strict-typing` is the Platinum rule with teeth: Home Assistant runs mypy in
# strict mode over integrations that claim it. This is core's generated
# mypy.ini [mypy] block at 2026.8.3 plus `strict`, which covers the flags core
# lists individually and adds no_implicit_reexport and disallow_any_generics,
# which core grants per module and a custom integration is not in the namespace
# for. Dropped from core's block: plugins, native_parser and num_workers, which
# are core-tree settings, and warn_incomplete_stub, because core type-checks its
# own stubs. Nothing is relaxed for the component or its library: every name is
# imported from the module that defines it, because neither asyncsleepiq nor
# homeassistant.components.light re-exports explicitly. The GitHub Tests job
# runs this with Home Assistant installed, which is the run that counts.
[tool.mypy]
python_version = "3.14"
platform = "linux"
strict = true
local_partial_types = true
no_implicit_optional = true
strict_bytes = true
warn_unreachable = true
extra_checks = false
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "redundant-self",
    "truthy-iterable",
]
disable_error_code = ["annotation-unchecked", "import-not-found", "import-untyped"]
follow_imports = "normal"
show_error_codes = true

[[tool.mypy.overrides]]
# The tests are not the integration. The Tests job runs mypy over
# custom_components/sleepiq_massage, where this block has no effect at all.
# `strict = false` does not belong here: mypy 1.18.2 accepts it in a per-module
# section without a warning and then discards the whole section, taking the
# relaxations beside it with it.
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
