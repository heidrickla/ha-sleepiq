name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Every job here is gated to GitHub. A mirror that reads .github/workflows as
# well skips them and runs .gitea/workflows/validate.yml instead.

jobs:
  tests:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0, not the default 1. The object-database scan in
      # tools/validate_local.py reads every commit message; a depth-1 checkout
      # holds one commit object and the scan reports a clean result it never
      # measured.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Home Assistant 2026.x needs Python 3.14.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # 0.13.357 pins Home Assistant 2026.8.3; it brings pytest, its asyncio
      # and aiohttp plugins, pytest-cov, PyYAML and Pillow with it (pinning
      # those again here makes pip's resolution impossible). asyncsleepiq is
      # the integration's own requirement, which the harness does not install.
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install "mypy==1.18.2" "ruff==0.15.21" \
            "asyncsleepiq==1.7.1" \
            "pytest-homeassistant-custom-component==0.13.357"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      # Two suites, one coverage total. The pure massage suite runs without
      # the Home Assistant plugin; the Home Assistant layer appends to its
      # data, and the gate is checked once, over both. Neither run passes -q:
      # the summary line is the evidence a CI log is read for. pytest is run as
      # a module so pyproject's `-p tests.winposix` resolves; that plugin only
      # does anything on Windows.
      - run: .venv/bin/python -m pytest tests/test_massage.py -p no:homeassistant
          --cov=custom_components/sleepiq_massage --cov-report=
      - run: .venv/bin/python -m pytest tests/ha
          --cov=custom_components/sleepiq_massage --cov-append
          --cov-report=term-missing --cov-fail-under=95
      - run: .venv/bin/python -m mypy custom_components/sleepiq_massage
      # The name half of both scans matches nothing without names, and the
      # names cannot live in the tree. The secret carries them in; the
      # validator fails when neither it nor docs/local/dev-hosts.txt supplies
      # one, so a run missing the secret is loud rather than green.
      - run: .venv/bin/python tools/validate_local.py
        env:
          HA_DEV_HOST_NAMES: ${{ secrets.HA_DEV_HOST_NAMES }}
