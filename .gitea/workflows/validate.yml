name: Validate

# The per-push job is one fast job. The slow Home Assistant actions are
# workflow_dispatch only. The Home Assistant test harness, mypy and the offline
# validator run in the GitHub Tests workflow, which is gated to GitHub and
# skips here.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ruff (PINNED)
        # Pinned deliberately. An unpinned linter makes CI non-reproducible:
        # this job passed locally and failed in CI purely because pip fetched a
        # newer ruff whose default rules differed from the local install.
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet "ruff==0.15.21"
          python3 -m ruff --version

      - name: Ruff
        # ruff.toml adopts Home Assistant core's isort settings, because this
        # repo vendors core's files and must not reformat them.
        run: |
          python3 -m ruff check .
          python3 -m ruff format --check .

      - name: Vendored core files are unmodified
        # The point of the baseline: an upstream resync stays a small diff only
        # while the untouched files stay byte-identical. Reformatting one - by
        # ruff --fix, an editor, or a well-meaning cleanup - silently destroys
        # that, and nothing else would notice. A line ending in `modified` in
        # the baseline is a file this project edits on purpose; NOTICE says how.
        run: |
          python3 - <<'PY'
          import hashlib, io, os, re, sys
          base, owned = {}, set()
          for line in io.open("docs/UPSTREAM-BASELINE.txt", encoding="utf-8"):
              m = re.match(r"\s*([0-9a-f]{64})\s+\*?(\S+)(\s+modified)?\s*$", line)
              if not m: continue
              base[m.group(2)] = m.group(1)
              if m.group(3): owned.add(m.group(2))
          notice = io.open("NOTICE", encoding="utf-8").read()
          bad = []
          for name, want in sorted(base.items()):
              p = os.path.join("custom_components/sleepiq_massage", name)
              if not os.path.exists(p):
                  bad.append(f"{name}: MISSING"); continue
              got = hashlib.sha256(open(p, "rb").read()).hexdigest()
              if name in owned:
                  if got == want: bad.append(f"{name}: marked modified but identical to upstream")
                  if name not in notice: bad.append(f"{name}: modified but not described in NOTICE")
              elif got != want:
                  bad.append(f"{name}: drifted from upstream 2026.8.2")
          if bad:
              print("Vendored core files must stay byte-identical unless marked modified:")
              for b in bad: print("  -", b)
              sys.exit(1)
          print(f"{len(base)-len(owned)} vendored file(s) match upstream, {len(owned)} modified on purpose")
          PY

      # No separate ast.parse step. Home Assistant requires Python 3.13 and
      # uses PEP 695 `type X = ...` statements, which an older python3 reports
      # as a syntax error. Ruff parses every file at target-version py313 per
      # ruff.toml, and tools/validate_local.py has the same constraint and runs
      # on Python 3.14 in the GitHub Tests job. Add one only with a pinned 3.13
      # toolchain.

      - name: JSON is valid
        run: |
          for f in custom_components/sleepiq_massage/*.json custom_components/sleepiq_massage/translations/*.json hacs.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8'))" "$f" || exit 1
          done
          echo "all JSON valid"

      - name: Manifest sanity
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("custom_components/sleepiq_massage/manifest.json", encoding="utf-8"))
          missing = [k for k in ("domain","name","version","documentation","codeowners") if not m.get(k)]
          assert not missing, f"manifest missing: {missing}"
          assert m["domain"] == "sleepiq_massage", m["domain"]
          # A custom integration without a version silently fails to load - the
          # symptom is a missing integration, not an error.
          assert m["version"], "version is required for a custom integration"
          assert "quality_scale" not in m, "the badge is core-only"
          print("manifest ok:", m["domain"], m["version"])
          PY

      - name: Translations ship and agree
        # Home Assistant reads translations/<lang>.json at runtime; strings.json
        # is only hassfest's input. Core's [%key:common::...] references resolve
        # only inside core's build and render as raw keys here.
        run: |
          python3 - <<'PY'
          import json
          s = json.load(open("custom_components/sleepiq_massage/strings.json", encoding="utf-8"))
          e = json.load(open("custom_components/sleepiq_massage/translations/en.json", encoding="utf-8"))
          assert s == e, "strings.json and translations/en.json differ - copy strings.json over"
          for name in ("strings.json", "translations/en.json"):
              assert "%key:" not in open(f"custom_components/sleepiq_massage/{name}", encoding="utf-8").read(), f"{name}: core-only [%key:...] reference"
          print("translations ok")
          PY

      - name: Quality scale is complete and honest
        run: |
          python3 -m pip install --quiet "PyYAML==6.0.2"
          python3 - <<'PY'
          import json, yaml
          rules = yaml.safe_load(open(
              "custom_components/sleepiq_massage/quality_scale.yaml", encoding="utf-8"))["rules"]
          todo = sorted(k for k, v in rules.items()
                        if isinstance(v, dict) and v.get("status") == "todo")
          for name, v in rules.items():
              if isinstance(v, dict):
                  assert v.get("status") in {"done","todo","exempt"}, name
                  if v.get("status") != "done":
                      assert str(v.get("comment","")).strip(), f"{name}: needs a reason"
              else:
                  assert v == "done", name
          claimed = json.load(open(
              "custom_components/sleepiq_massage/manifest.json", encoding="utf-8")
          ).get("quality_scale")
          assert not (claimed and todo), f"manifest claims {claimed} with todo: {todo}"
          print(f"{len(rules)} rules; still todo: {', '.join(todo) or 'none'}")
          PY

  # Slow, and depend on fetching third-party actions. Manual only, so an
  # ordinary push stays fast.
  home-assistant:
    name: hassfest + HACS
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration
          # No `ignore:` key on purpose. The hacs/default pull-request template
          # asks explicitly whether any check was ignored, and ignoring one is
          # a reason for rejection. The brands check reads the tree's
          # custom_components/sleepiq_massage/brand/icon.png.
