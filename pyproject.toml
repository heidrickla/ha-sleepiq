[project]
name = "ha-sleepiq"
version = "0.1.0"
description = "Home Assistant's SleepIQ integration with massage control added."
requires-python = ">=3.13"

# Ruff is configured in ruff.toml, which explains why the vendored core files
# keep core's import order. Ruff reads that file in preference to this one.

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-homeassistant-custom-component's `hass` fixture is async, and pytest
# does not handle async fixtures natively. Without this every tests/ha test
# errors with "requested an async fixture with no plugin or hook that handled
# it" rather than failing on anything real.
asyncio_mode = "auto"

# `strict-typing` is the Platinum rule with teeth: Home Assistant runs mypy in
# strict mode over integrations that claim it. The settings below mirror the
# strict block core applies to a strict-typed integration, with nothing
# relaxed and no per-module allowance for the component or its library: every
# name is imported from the module that defines it, because neither
# asyncsleepiq nor homeassistant.components.light re-exports explicitly and
# strict mode is right to say so. The GitHub Tests job runs this with Home
# Assistant installed, which is the run that counts.
[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
# The tests are not the integration. The Tests job runs mypy over
# custom_components/sleepiq, where this block has no effect at all.
module = "tests.*"
strict = false
disallow_untyped_defs = false
