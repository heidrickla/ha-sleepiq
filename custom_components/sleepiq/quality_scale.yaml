# The Integration Quality Scale, rule by rule, for a repository that vendors
# core's sleepiq and adds massage control. Wave 1 recorded which rules core's
# own sleepiq fails; wave 2 forked those files rather than inherit the gaps, so
# every entity here is this project's to answer for. Evidence is the GitHub
# Tests workflow, which runs on every push: ruff, both test suites with
# coverage gated at 95%, mypy in strict mode with Home Assistant installed, and
# tools/validate_local.py, which fails a rule filed `done` whose mechanism is
# not in the files. The badge itself is core-only and manifest.json claims no
# tier.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration registers no actions; everything is an entity.
  appropriate-polling:
    status: done
    comment: |
      Three coordinators, core's cadence: bed and foundation status every
      60 seconds (presence and the massage countdown move on that scale),
      pause mode every 5 minutes, sleep health data hourly (it changes once a
      night). The 60 second poll also re-reads the account's bed list, which
      is one extra GET and what dynamic-devices and stale-devices are built on.
  brands:
    status: done
    comment: |
      The domain is core's, so the brand is served from home-assistant/brands'
      core_integrations/sleepiq like any core integration. That is also why
      the HACS action runs with `ignore: brands`: its check reads only the
      custom half of the brands repo, which by design has no sleepiq entry.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: |
      tests/ha/test_config_flow.py covers every step: the user step, both
      error mappings each followed by a retry that reaches CREATE_ENTRY, the
      duplicate abort, the YAML import in both outcomes, DHCP discovery in
      both outcomes, reconfigure with and without a new password including the
      wrong-account abort and an error followed by recovery, and reauth in
      both outcomes. Every form that can show an error is checked not to echo
      the password. config_flow.py is at 100% line coverage.
  config-flow:
    status: done
    comment: |
      Every step describes its fields in data_description, the password is a
      masked TextSelector with no default, and the unique id is the lowercased
      account name.
  dependency-transparency:
    status: done
    comment: |
      asyncsleepiq is MIT, on PyPI, built from github.com/kbickar/asyncsleepiq
      by its python-publish workflow, and pinned in the manifest.
  docs-actions:
    status: exempt
    comment: This integration provides no actions.
  docs-conditions:
    status: exempt
    comment: This integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration provides no triggers.
  entity-event-setup:
    status: done
    comment: |
      Entities are coordinator-driven; CoordinatorEntity subscribes in
      async_added_to_hass and unsubscribes on removal. The listener that adds
      a later bed's entities is registered with entry.async_on_unload.
  entity-unique-id:
    status: done
    comment: |
      Everything the bed has once per side - the massage entities, the foot
      warmer and core climate selects - is keyed on bed id and physical side,
      like the foot warming and core climate timer numbers. Core keys the two
      selects on the sleeper instead, which collides on a bed where only one
      side has a sleeper registered: the empty side falls back to the first
      sleeper and Home Assistant drops the second entity. Fixing that is a
      deliberate divergence from core, so entities installed under either the
      first release's massage ids or core's select ids are migrated at setup
      and keep their entity ids and history; README says what the divergence
      costs if core's integration takes over again. Every other unique id is
      core's and is unchanged. Both migrations and the one-sleeper bed are
      tested.
  has-entity-name:
    status: done
    comment: |
      Every entity on every platform sets _attr_has_entity_name and takes its
      name from strings.json; no _attr_name is left anywhere in the component,
      which tools/validate_local.py enforces. Names read as "<bed> <sleeper>
      firmness" rather than repeating "SleepNumber <bed>" in every entity.
  runtime-data: done
  test-before-configure:
    status: done
    comment: |
      The flow logs in with the submitted credentials before creating the
      entry; a rejected password or a timeout is shown on the form.
  test-before-setup:
    status: done
    comment: |
      Login and bed enumeration raise ConfigEntryAuthFailed and
      ConfigEntryNotReady with translated messages, then the three
      coordinators run async_config_entry_first_refresh.
  unique-config-entry:
    status: done
    comment: |
      The lowercased account name is the unique id; adding the same account
      twice aborts with already_configured, whether typed by the user or
      offered by discovery. Tested.

  # Silver
  action-exceptions:
    status: done
    comment: |
      Every write path on every platform goes through entity.async_write_to_bed,
      which raises a translated HomeAssistantError when the bed refuses and a
      translated ServiceValidationError when the library rejects the value as
      out of range. Tested on the preset, foot warmer, core climate, firmness,
      actuator, light, pause switch, buttons and massage entities.
  config-entry-unloading:
    status: done
    comment: |
      async_unload_platforms; the per-entry aiohttp session created with
      async_create_clientsession during setup is closed by Home Assistant on
      unload, and each platform's new-bed listener is removed with the entry.
  docs-configuration-parameters:
    status: exempt
    comment: |
      There is no options flow. The account is the only setting and the
      reconfigure flow changes it; README documents both.
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: |
      Coordinator entities go unavailable when their poll fails. The massage
      GET runs in the same gather as bed and foundation status, so a failure
      of that endpoint alone also marks the status entities unavailable; the
      whole read comes from one account session and fails together in
      practice. Buttons are stateless.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      DataUpdateCoordinator logs once when a poll first fails and once when it
      recovers. A rejected re-login during a poll raises ConfigEntryAuthFailed
      and starts reauth rather than logging a traceback every 60 seconds.
  parallel-updates:
    status: done
    comment: |
      The read-only platforms (binary_sensor, sensor) set 0: the coordinator
      does the polling. Every platform that writes to the bed (button, light,
      number, select, switch) sets 1, because the cloud API is happiest with
      one request in flight per account.
  reauthentication-flow:
    status: done
    comment: |
      reauth_confirm asks for the password only; a login failure at setup or
      during any poll raises ConfigEntryAuthFailed and starts it. Tested in
      both outcomes.
  test-coverage:
    status: done
    comment: |
      The GitHub Tests workflow runs the pure massage suite and the Home
      Assistant layer suite over one coverage total and fails under 95%. It
      stands at 100% of custom_components/sleepiq, with every platform, both
      migrations, the discovery and reconfigure flows, the repair issue, and
      the added and removed bed paths exercised.

  # Gold
  devices:
    status: done
    comment: |
      One device per bed, keyed on its MAC and its bed id, with manufacturer
      and model.
  diagnostics:
    status: done
    comment: |
      diagnostics.py dumps the entry, coordinator health, each bed's sleepers,
      foundation features and massage state, redacting the account, the bed's
      MAC and the sleepers' names. The massage mode select also keeps the raw
      massage block as attributes, on purpose: the open Full Body pattern
      investigation needs to watch it live while the vendor app drives the
      bed, which a downloaded snapshot cannot do.
  discovery:
    status: done
    comment: |
      The manifest matches the bed's DHCP MAC prefix and the flow has an
      async_step_dhcp. The bed announces nothing about which SleepIQ account
      owns it and the integration talks to the cloud, so the step offers the
      sign-in form; when an entry already exists it aborts, because one entry
      covers every bed on the account. Both outcomes are tested.
  discovery-update-info:
    status: exempt
    comment: |
      Cloud polling. The config entry holds an account, never an address, and
      the bed's LAN address is not used at any point, so a discovery carries
      no network information that could be updated.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: |
      The 60 second poll reads the account's bed list; when it differs from
      the beds already loaded the account is enumerated again and every
      platform's coordinator listener adds the new bed's entities. A bed
      bought later needs no reload. Tested.
  entity-category:
    status: done
    comment: |
      The calibrate button is CONFIG: re-baselining the pressure sensors sets
      the bed up rather than operating it. Everything else is a control or a
      reading someone reaches for on the bed's card, including the massage
      timer, which was considered for CONFIG and rejected: it is an armed
      countdown set at massage time, the same shape as core's foot warming and
      core climate timers, not a device setting.
  entity-device-class:
    status: done
    comment: |
      Occupancy on presence, duration on the timers, sleep duration and HRV.
      Sleep score, heart rate, respiratory rate and the bed's pressure reading
      have no matching class; the pressure is a proprietary unitless figure,
      not a pressure in Pa.
  entity-disabled-by-default:
    status: done
    comment: |
      Nothing is disabled. Every entity is either a control or a nightly
      reading users install this for; the pressure sensor is core's choice
      and is what the sleep number is derived from.
  entity-translations:
    status: done
    comment: |
      Every entity has a translated name in strings.json, with the sleeper or
      the side as a placeholder where a bed has two of a thing, and one key
      per side and end for the actuators so no name is assembled from English
      words. tools/validate_local.py fails a translation key with no name and
      a name no platform uses.
  exception-translations:
    status: done
    comment: |
      Every HomeAssistantError, ServiceValidationError, ConfigEntryAuthFailed,
      ConfigEntryNotReady and UpdateFailed this integration raises carries a
      translation key, including the shared write helper every platform's
      write path goes through. tools/validate_local.py fails on one that does
      not, in any module.
  icon-translations:
    status: done
    comment: |
      Icons come from icons.json through the translation key; no _attr_icon is
      left anywhere in the component, which tools/validate_local.py enforces.
      The presence sensor's bed and empty-bed icons are state icons on its
      key. Entities whose device class already supplies the right icon get no
      override.
  reconfiguration-flow:
    status: done
    comment: |
      async_step_reconfigure corrects the account the entry signs in with,
      keeping the stored password when the field is left blank and aborting
      with wrong_account when the username belongs to a different account,
      which would be a second entry with its own beds and history.
  repair-issues:
    status: done
    comment: |
      Importing the deprecated YAML block raises a repair issue that names the
      one action that clears it: delete the sleepiq block from
      configuration.yaml. Nothing else needs the user's hand; authentication
      failures go to reauth, which is a flow rather than an issue.
  stale-devices:
    status: done
    comment: |
      A bed that leaves the account is removed from the device registry on the
      next poll, taking its entities with it. A bed list that comes back empty
      is treated as a hiccup rather than as every bed being removed. Tested in
      both directions.

  # Platinum
  async-dependency:
    status: done
    comment: asyncsleepiq is asyncio on aiohttp.
  inject-websession:
    status: done
    comment: |
      Setup passes a session from async_create_clientsession (core's choice:
      the library carries a login cookie per account); the config flow uses
      async_get_clientsession.
  strict-typing:
    status: done
    comment: |
      pyproject.toml runs mypy with strict = true, no relaxations and no
      per-module allowance for the component or its libraries: every name is
      imported from the module that defines it, because neither asyncsleepiq
      nor homeassistant.components.light re-exports explicitly and strict mode
      is right to say so. The GitHub Tests job runs it with Home Assistant
      installed on every push. asyncsleepiq ships py.typed. A local run
      without Home Assistant sees every HA class as Any and is not the check.
