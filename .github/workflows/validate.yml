name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Every job here is gated to GitHub. A mirror that reads .github/workflows as
# well skips them and runs .gitea/workflows/validate.yml instead.

jobs:
  hassfest:
    if: github.server_url == 'https://github.com'
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    if: github.server_url == 'https://github.com'
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # No `ignore:` key on purpose. The hacs/default pull-request template
          # asks explicitly whether any check was ignored, and ignoring one is
          # a reason for rejection. The brands check reads the tree's
          # custom_components/sleepiq_massage/brand/icon.png.
