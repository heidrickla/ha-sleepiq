name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Gitea's act_runner also picks up .github/workflows, so every job here is
# gated to GitHub. On the gitea forge these skip instantly and
# .gitea/workflows/validate.yml is the one that runs - the runner is shared
# with capacity 1 and duplicate jobs queue behind each other.

jobs:
  hassfest:
    if: github.server_url == 'https://github.com'
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    if: github.server_url == 'https://github.com'
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Brand art ships in custom_components/sleepiq_massage/brand/, which
          # Home Assistant serves at /api/brands/integration/<domain>/<file>.
          # The action's brands check reads home-assistant/brands, where this
          # project does not register.
          ignore: brands
