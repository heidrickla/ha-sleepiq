# The Integration Quality Scale, rule by rule, for a repository that vendors
# core's sleepiq and adds massage control. "core sleepiq" in a comment means the
# gap is core's own: the vendored file is byte-identical to core, core's sleepiq
# does not meet the rule either, and fixing it here means forking that file.
# Lewis, 2026-09-04: those forks are wave 2. Until then the rule is todo, not
# hidden. The badge itself is core-only and manifest.json claims no tier.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration registers no actions; everything is an entity.
  appropriate-polling:
    status: done
    comment: |
      Three coordinators, core's cadence: bed and foundation status every
      60 seconds (presence and the massage countdown move on that scale),
      pause mode every 5 minutes, sleep health data hourly (it changes once a
      night).
  brands:
    status: done
    comment: |
      The domain is core's, so the brand is served from home-assistant/brands'
      core_integrations/sleepiq like any core integration. That is also why
      the HACS action runs with `ignore: brands`: its check reads only the
      custom half of the brands repo, which by design has no sleepiq entry.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: |
      tests/ha/test_config_flow.py covers the user step, both error mappings
      each followed by a retry that reaches CREATE_ENTRY, the duplicate abort,
      the YAML import in both outcomes, and reauth in both outcomes including
      recovery from a wrong password. Every form that can show an error is
      checked not to echo the password. Run by the GitHub Tests workflow on
      every push.
  config-flow:
    status: done
    comment: |
      Both steps describe every field in data_description, the password is a
      masked TextSelector with no default, and the unique id is the lowercased
      account name.
  dependency-transparency:
    status: done
    comment: |
      asyncsleepiq is MIT, on PyPI, built from github.com/kbickar/asyncsleepiq
      by its python-publish workflow, and pinned in the manifest.
  docs-actions:
    status: exempt
    comment: This integration provides no actions.
  docs-conditions:
    status: exempt
    comment: This integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration provides no triggers.
  entity-event-setup:
    status: done
    comment: |
      Entities are coordinator-driven; CoordinatorEntity subscribes in
      async_added_to_hass and unsubscribes on removal. Nothing subscribes to
      the library directly.
  entity-unique-id:
    status: done
    comment: |
      Massage entities are keyed on bed id and physical side, like core's foot
      warmer and core climate entities, so a bed with one sleeper gets two
      distinct sides. Entities created by the first release under the
      sleeper-keyed id are migrated at setup.
  has-entity-name:
    status: todo
    comment: |
      The four massage entities have has_entity_name with translated names.
      core sleepiq: the vendored binary_sensor, button, light, number, select
      (preset, foot warmer, core climate), sensor and switch entities set a
      hard-coded _attr_name as core ships them. Wave 2 forks them.
  runtime-data: done
  test-before-configure:
    status: done
    comment: |
      The flow logs in with the submitted credentials before creating the
      entry; a rejected password or a timeout is shown on the form.
  test-before-setup:
    status: done
    comment: |
      Login and bed enumeration raise ConfigEntryAuthFailed and
      ConfigEntryNotReady with translated messages, then the three
      coordinators run async_config_entry_first_refresh.
  unique-config-entry:
    status: done
    comment: |
      The lowercased account name is the unique id; adding the same account
      twice aborts with already_configured. Tested.

  # Silver
  action-exceptions:
    status: todo
    comment: |
      Massage writes raise a translated HomeAssistantError when the bed
      refuses them. core sleepiq: the vendored preset, foot warmer, core
      climate, firmness, actuator, light, pause and button write paths let
      the library's exceptions propagate raw. Wave 2 forks them.
  config-entry-unloading:
    status: done
    comment: |
      async_unload_platforms; the per-entry aiohttp session created with
      async_create_clientsession during setup is closed by Home Assistant on
      unload.
  docs-configuration-parameters:
    status: exempt
    comment: There is no options flow; the account is the only setting.
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: |
      Coordinator entities go unavailable when their poll fails. The massage
      GET runs in the same gather as bed and foundation status, so a failure
      of that endpoint alone also marks the status entities unavailable; the
      whole read comes from one account session and fails together in
      practice. Buttons are stateless (core sleepiq).
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      DataUpdateCoordinator logs once when a poll first fails and once when it
      recovers. A rejected re-login during a poll now raises
      ConfigEntryAuthFailed and starts reauth rather than logging a traceback
      every 60 seconds.
  parallel-updates:
    status: todo
    comment: |
      select.py and number.py set PARALLEL_UPDATES = 1. core sleepiq: the
      other five platforms are byte-identical to core and set nothing. Wave 2.
  reauthentication-flow:
    status: done
    comment: |
      reauth_confirm asks for the password only; a login failure at setup or
      during any poll raises ConfigEntryAuthFailed and starts it. Tested in
      both outcomes.
  test-coverage:
    status: todo
    comment: |
      The GitHub Tests workflow runs the pure massage suite and tests/ha with
      --cov=custom_components/sleepiq on every push and reports per-module
      coverage. Not gated at 95% yet: the vendored platforms are exercised
      only where the massage tests load them, and core's own platform tests
      are not vendored. Vendor them or write equivalents, then add
      --cov-fail-under=95.

  # Gold
  devices:
    status: done
    comment: One device per bed, keyed on its MAC, with manufacturer and model.
  diagnostics:
    status: done
    comment: |
      diagnostics.py dumps the entry, coordinator health, each bed's sleepers,
      foundation features and massage state, redacting the account, the bed's
      MAC and the sleepers' names. The massage mode select also keeps the raw
      massage block as attributes, on purpose: the open Full Body pattern
      investigation needs to watch it live while the vendor app drives the
      bed, which a downloaded snapshot cannot do.
  discovery:
    status: todo
    comment: |
      core sleepiq: the manifest matches DHCP on the bed's MAC prefix but the
      flow has no async_step_dhcp, so a discovered bed only opens the login
      form without a unique id. A proper step would key on the account, which
      the hub does not announce. Wave 2 decides whether to drop the dhcp
      match or implement the step.
  discovery-update-info:
    status: exempt
    comment: |
      Cloud polling. The bed's LAN address is never used, so there is no
      network information a discovery could update.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: todo
    comment: |
      core sleepiq: beds are enumerated once at setup. A bed added to the
      account appears after a reload, not on the next poll.
  entity-category:
    status: done
    comment: |
      Every entity is a control or a reading someone reaches for on the bed's
      card, so none gets a category. The massage timer was considered for
      CONFIG and rejected: it is an armed countdown set at massage time, the
      same shape as core's foot warming and core climate timers, not a
      device setting.
  entity-device-class:
    status: done
    comment: |
      Occupancy on presence, duration on the timers, sleep duration and HRV.
      Sleep score, heart rate, respiratory rate and the bed's pressure reading
      have no matching class; the pressure is a proprietary unitless figure,
      not a pressure in Pa.
  entity-disabled-by-default:
    status: done
    comment: |
      Nothing is disabled. Every entity is either a control or a nightly
      reading users install this for; the pressure sensor is core's choice
      and is what the sleep number is derived from.
  entity-translations:
    status: todo
    comment: |
      The massage entities have translated names with the sleeper as a
      placeholder. core sleepiq: the vendored entities carry hard-coded
      English names and translate states only. Wave 2 with has-entity-name.
  exception-translations:
    status: done
    comment: |
      Every HomeAssistantError, ConfigEntryAuthFailed, ConfigEntryNotReady
      and UpdateFailed this repository raises carries a translation key, and
      tools/validate_local.py fails on one that does not, in any module. The
      vendored write paths raise library exceptions untranslated; that is the
      action-exceptions gap, tracked there.
  icon-translations:
    status: todo
    comment: |
      The massage entities take their icons from icons.json. core sleepiq:
      the vendored base classes set _attr_icon = mdi:bed on every coordinator
      entity and the number and button descriptions carry icons, which
      overrides icons.json. Wave 2.
  reconfiguration-flow:
    status: exempt
    comment: |
      The account name is the entry's identity and its unique id; changing it
      is a different account and a new entry. The password is the only other
      setting and is handled by the reauth flow.
  repair-issues:
    status: todo
    comment: |
      core sleepiq: the legacy YAML import path still exists and creates no
      deprecated_yaml repair issue. Nothing else needs the user's hand;
      authentication failures go to reauth.
  stale-devices:
    status: todo
    comment: |
      core sleepiq: a bed removed from the account keeps its device until the
      entry is removed.

  # Platinum
  async-dependency:
    status: done
    comment: asyncsleepiq is asyncio on aiohttp.
  inject-websession:
    status: done
    comment: |
      Setup passes a session from async_create_clientsession (core's choice:
      the library carries a login cookie per account); the config flow uses
      async_get_clientsession.
  strict-typing:
    status: done
    comment: |
      pyproject.toml runs mypy with strict = true and no relaxations; the
      GitHub Tests job runs it with Home Assistant installed on every push,
      and that configuration was green against Home Assistant 2026.8.3 before
      the first push. The attribute injection onto the library's foundation
      object is gone: the massage objects live on the coordinator and in
      runtime_data. Two scoped overrides keep implicit re-export for
      asyncsleepiq and for homeassistant.components.light, whose __init__
      modules export names by import without an __all__; both are other
      people's modules imported by byte-identical core files. asyncsleepiq
      ships py.typed. A local run without Home Assistant sees every HA class
      as Any and is not the check.
